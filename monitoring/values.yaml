defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 6h
    scrapeInterval: 60s
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 800Mi

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

additionalPrometheusRulesMap:
  skill-job-matcher:
    groups:
      - name: skill-job-matcher
        rules:
          - alert: BackendUnavailable
            expr: kube_deployment_status_replicas_available{namespace="default",deployment="backend"} < 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: No backend pods are available
              description: Deployment backend in namespace default has no available replicas.
